i18n:
  name: "Configuring display manager..."

dontChroot: false
timeout: 10

- command: |
      if systemctl is-enabled greetd.service >/dev/null 2>&1; then
        echo "greetd was selected. Overriding /etc/greetd/config.toml..."
        cp -f /usr/share/noctalia-greeter/greetd/config.toml /etc/greetd/config.toml
        chown -R root: /etc/greetd
        chmod 644 /etc/greetd/config.toml
      else
        echo "greetd was not selected. Skipping configuration."
      fi
  