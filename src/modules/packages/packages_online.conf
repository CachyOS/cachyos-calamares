#
# sets pacman options for package handling.
---

backend: pacman
skip_if_no_internet: false
# pacstrap runs "pacman --sysroot <target> -Sy" right before this module, so the
# target databases are already fresh and everything installed is up to date.
# Re-syncing and running -Su here only costs time.
update_db: false
update_system: false

pacman:
    num_retries: 6
    disable_download_timeout: true
    needed_only: true
